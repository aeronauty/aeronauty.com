name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aeronauty-site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: aeronauty-site/package-lock.json

      - run: npm ci

      # Temporarily move dynamic routes out so static export succeeds
      # (dashboard + API routes can't be statically exported)
      - name: Prepare for static export
        run: |
          mkdir -p /tmp/dynamic-routes
          mv app/dashboard /tmp/dynamic-routes/ 2>/dev/null || true
          mv app/api /tmp/dynamic-routes/ 2>/dev/null || true
          mv middleware.ts /tmp/dynamic-routes/ 2>/dev/null || true
          # Add static export config
          cat > next.config.mjs << 'EOF'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: "export",
            images: { unoptimized: true },
          };
          export default nextConfig;
          EOF

      - run: npm run build

      # Restore dynamic routes (not needed for deploy, but keeps things clean)
      - name: Restore dynamic routes
        if: always()
        run: |
          mv /tmp/dynamic-routes/dashboard app/ 2>/dev/null || true
          mv /tmp/dynamic-routes/api app/ 2>/dev/null || true
          mv /tmp/dynamic-routes/middleware.ts . 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: aeronauty-site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
