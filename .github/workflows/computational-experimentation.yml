name: Computational experimentation essay

on:
  pull_request:
    paths:
      - 'aeronauty-site/content/private/topology-instinct/computational-experimentation/**'
      - 'aeronauty-site/lib/private-articles.ts'
      - 'aeronauty-site/package.json'
      - '.github/workflows/computational-experimentation.yml'
  push:
    branches: [main]
    paths:
      - 'aeronauty-site/content/private/topology-instinct/computational-experimentation/**'
      - 'aeronauty-site/lib/private-articles.ts'
      - 'aeronauty-site/package.json'
      - '.github/workflows/computational-experimentation.yml'

jobs:
  trust-case:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check article scripts
        run: |
          node --check aeronauty-site/content/private/topology-instinct/computational-experimentation/article-runtime.js
          node --check aeronauty-site/content/private/topology-instinct/computational-experimentation/build_article.mjs
          node --check aeronauty-site/content/private/topology-instinct/computational-experimentation/sync-google-doc.mjs
          node --check aeronauty-site/content/private/topology-instinct/computational-experimentation/figures/calibration-bench.mjs
      - name: Test shared aerodynamic primitives
        run: node --test aeronauty-site/content/private/topology-instinct/computational-experimentation/test-calibration.mjs
      - name: Check generated article is current
        run: node aeronauty-site/content/private/topology-instinct/computational-experimentation/build_article.mjs --check
