name: Computational experimentation essay

on:
  pull_request:
    paths:
      - 'aeronauty-site/content/private/topology-instinct/computational-experimentation/**'
      - 'aeronauty-site/lib/private-articles.ts'
      - 'aeronauty-site/package.json'
      - '.github/workflows/computational-experimentation.yml'
  push:
    branches: [main]
    paths:
      - 'aeronauty-site/content/private/topology-instinct/computational-experimentation/**'
      - 'aeronauty-site/lib/private-articles.ts'
      - 'aeronauty-site/package.json'
      - '.github/workflows/computational-experimentation.yml'

jobs:
  trust-case:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check scripts
        run: |
          node --check aeronauty-site/content/private/topology-instinct/computational-experimentation/vortex-core.js
          node --check aeronauty-site/content/private/topology-instinct/computational-experimentation/sync-google-doc.mjs
          node --check aeronauty-site/content/private/topology-instinct/computational-experimentation/validate-article.mjs
      - name: Test shared aerodynamic primitives and article package
        run: |
          node aeronauty-site/content/private/topology-instinct/computational-experimentation/test-vortex-core.mjs
          node aeronauty-site/content/private/topology-instinct/computational-experimentation/validate-article.mjs
