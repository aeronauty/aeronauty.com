name: Computational experimentation essay

on:
  pull_request:
    paths:
      - 'aeronauty-site/content/private/computational-experimentation/**'
      - 'aeronauty-site/app/lab/computational-experimentation/**'
      - 'aeronauty-site/lib/private-articles.ts'
      - 'aeronauty-site/package.json'
      - '.github/workflows/computational-experimentation.yml'
  push:
    branches: [main]
    paths:
      - 'aeronauty-site/content/private/computational-experimentation/**'
      - 'aeronauty-site/app/lab/computational-experimentation/**'
      - 'aeronauty-site/lib/private-articles.ts'
      - 'aeronauty-site/package.json'
      - '.github/workflows/computational-experimentation.yml'

jobs:
  trust-case:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check article scripts
        run: |
          node --check aeronauty-site/content/private/computational-experimentation/article.js
          node --check aeronauty-site/content/private/computational-experimentation/build-article.mjs
          node --check aeronauty-site/content/private/computational-experimentation/sync-google-doc.mjs
      - name: Test shared aerodynamic primitives
        run: node aeronauty-site/content/private/computational-experimentation/test-vortex-core.mjs
      - name: Rebuild the article from the Google Doc snapshot
        run: node aeronauty-site/content/private/computational-experimentation/build-article.mjs
