# Local Supabase CLI configuration for Game Ledger development.
# The production project ref is intentionally not stored here; use
# `supabase link --project-ref <ref>` in an authenticated local checkout.
project_id = "aeronauty-tile-tally"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = false
port = 55329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = true

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 55324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000/apps/tile-tally"
additional_redirect_urls = ["http://localhost:3000/apps/tile-tally"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 55883
deno_version = 1

[analytics]
enabled = true
port = 55327
backend = "postgres"
