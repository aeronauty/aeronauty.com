<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">No-Bull Prize cartoon</title>
  <desc id="desc">Editorial cartoon of two workshop attendees shaking hands while one presents a blue wrapped No-Bull Prize package at a Jeppesen Crew and Fleet Optimisation Workshop.</desc>
  <defs>
    <linearGradient id="wall" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff4cf"/>
      <stop offset="1" stop-color="#f6ddad"/>
    </linearGradient>
    <linearGradient id="blueWrap" x1="0" x2="1">
      <stop offset="0" stop-color="#0f4fd8"/>
      <stop offset="0.55" stop-color="#1d7cff"/>
      <stop offset="1" stop-color="#0935a4"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#1f2937" flood-opacity="0.18"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
      <feBlend mode="multiply" in2="SourceGraphic"/>
    </filter>
    <style>
      .ink{stroke:#1f2937;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#1f2937;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .soft{stroke:#415064;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
      .label{font-family:Georgia,serif;font-weight:700;fill:#1f2937}
      .small{font-family:Inter,Arial,sans-serif;font-weight:700;letter-spacing:.06em;fill:#334155}
    </style>
  </defs>

  <rect width="1200" height="760" rx="26" fill="url(#wall)"/>
  <g opacity=".25">
    <path d="M0 650h1200M42 684h1116M120 718h920" class="soft"/>
    <path d="M28 95h1144M62 195h1080M50 310h1084" class="soft"/>
  </g>

  <g transform="translate(58 48)">
    <rect x="0" y="0" width="1084" height="504" rx="18" fill="#fff8df" opacity=".64"/>
    <g opacity=".9">
      <rect x="24" y="34" width="214" height="112" rx="12" fill="#caa56c" class="thin"/>
      <rect x="272" y="28" width="154" height="122" rx="10" fill="#d8bd83" class="thin"/>
      <rect x="470" y="34" width="248" height="112" rx="12" fill="#e9cf94" class="thin"/>
      <rect x="758" y="22" width="250" height="132" rx="16" fill="#c9975a" class="thin"/>
      <rect x="46" y="206" width="180" height="122" rx="12" fill="#e1c588" class="thin"/>
      <rect x="270" y="206" width="206" height="122" rx="12" fill="#d4a464" class="thin"/>
      <rect x="528" y="196" width="190" height="132" rx="14" fill="#ead6a3" class="thin"/>
      <rect x="774" y="196" width="216" height="132" rx="13" fill="#dbc08a" class="thin"/>
    </g>
    <path d="M28 166h1030M28 350h1030" class="thin" opacity=".5"/>
  </g>

  <g transform="translate(460 72)" filter="url(#softShadow)">
    <path d="M70 0h340a18 18 0 0 1 18 18v102a18 18 0 0 1-18 18H70a18 18 0 0 1-18-18V18A18 18 0 0 1 70 0z" fill="#fffdf5" class="ink"/>
