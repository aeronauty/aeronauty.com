  <!-- rough.js for hand-drawn aesthetic -->
  <script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script>

  <style>
    /* Page chrome — only used for standalone viewing.
       The integration step lifts the .af-figure block, not this. */
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #ffffff;
      color: #1f2328;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #111418; color: #e6e6e6; }
    }
    main {
      max-width: 1080px;
      margin: 0 auto;
    }

    /* ===========================================================
       af- = adhd-flowchart, namespaced to avoid collision with
       the globe demo or anything else on the article page.

       Per-step scrollytelling figure. Eight steps total:
         01 — get new idea           (meme node 1 + cartoon)
         02 — start new project      (meme node 2 + cartoon)
         03 — tell everyone          (meme node 3 + cartoon, loop closes)
         04 — finish project, orphaned (the gag — finish faded off-side)
         05 — recognise it's connected to three previous ideas (subversion node 1)
         06 — hand the boring bits to a swarm of agents (subversion node 2)
         07 — stay at the connection level (subversion node 3)
         08 — actually finish (subversion node 4 — green)
       =========================================================== */

    .af-figure {
      position: relative;
      width: 100%;
      margin: 0 auto;
      --af-fg: #1f2328;
      --af-muted: #6b7280;
      --af-faint: #b0b6bf;
      --af-accent: #0e7490;
      --af-row-band: rgba(14, 116, 144, 0.06);
      --af-meme-fill: #fef9c3;
      --af-meme-stroke: #854d0e;
      --af-sub-fill: #e0f2fe;
      --af-sub-stroke: #0e7490;
      --af-orphan-fill: #d1d5db;
      --af-orphan-stroke: #6b7280;
      --af-finish-green-fill: #bbf7d0;
      --af-finish-green-stroke: #166534;
      --af-edge: #1f2328;
      --af-edge-soft: #6b7280;
      --af-rule: #d8dde6;
      --af-stage-bg: #ffffff;
      --af-stage-border: #d8dde6;
    }

    @media (prefers-color-scheme: dark) {
      .af-figure {
        --af-fg: #e6e6e6;
        --af-muted: #9aa0a6;
        --af-faint: #5c6a82;
        --af-accent: #67e8f9;
        --af-row-band: rgba(103, 232, 249, 0.08);
        --af-meme-fill: #4a3508;
        --af-meme-stroke: #e0b84a;
        --af-sub-fill: #0f2942;
        --af-sub-stroke: #67e8f9;
        --af-orphan-fill: #2a2f36;
        --af-orphan-stroke: #6b7280;
        --af-finish-green-fill: #14391f;
        --af-finish-green-stroke: #5fc07b;
        --af-edge: #e6e6e6;
        --af-edge-soft: #9aa0a6;
        --af-rule: #2a3447;
        --af-stage-bg: #161a20;
        --af-stage-border: #2a3447;
      }
    }

    /* ----- Top step bar ----- */
    .af-stepbar {
      display: flex;
      gap: 6px;
      margin: 0 0 14px;
      padding: 0;
      list-style: none;
      flex-wrap: wrap;
    }
    .af-stepbar li {
      flex: 1 1 0;
      min-width: 28px;
      height: 3px;
      background: var(--af-rule);
      border-radius: 2px;
      transition: background 320ms ease, transform 320ms ease;
      cursor: pointer;
    }
    .af-stepbar li.af-step-done { background: var(--af-muted); }
    .af-stepbar li.af-step-active {
      background: var(--af-accent);
      transform: scaleY(1.6);
    }
    .af-stepbar-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--af-muted);
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      margin: 0 0 16px;
    }
    .af-stepbar-meta .af-phase { color: var(--af-accent); font-weight: 600; }
    .af-stepbar-meta .af-counter { font-variant-numeric: tabular-nums; }

    /* ----- Two-column layout: flowchart left, cartoon panel right ----- */
    .af-stage {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
      gap: 28px;
      align-items: stretch;
    }
    @media (max-width: 760px) {
      .af-stage { grid-template-columns: 1fr; gap: 16px; }
    }

    .af-svg-pane {
      position: relative;
      border: 1px solid var(--af-stage-border);
      border-radius: 10px;
      background: var(--af-stage-bg);
      padding: 16px 14px 12px;
      min-height: 420px;
      display: flex;
      flex-direction: column;
    }
    .af-svg-wrap {
      flex: 1 1 auto;
      min-height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .af-figure svg {
      width: 100%;
      height: 100%;
      max-height: 100%;
      display: block;
      overflow: visible;
    }

    .af-cartoon-pane {
      position: relative;
      border: 1px solid var(--af-stage-border);
      border-radius: 10px;
      background: var(--af-stage-bg);
      overflow: hidden;
      min-height: 420px;
      display: flex;
      flex-direction: column;
    }
    .af-cartoon-stack {
      position: relative;
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
    }
    .af-cartoon-frame {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      opacity: 0;
      transform: translateX(18px);
      transition: opacity 360ms ease, transform 420ms cubic-bezier(.2,.8,.2,1);
      pointer-events: none;
    }
    .af-cartoon-frame img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 6px;
      display: block;
    }
    .af-cartoon-frame.af-show {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }
    .af-cartoon-empty {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 26px;
      color: var(--af-muted);
      font-style: italic;
      font-size: 14px;
      text-align: center;
      opacity: 0;
      transition: opacity 320ms ease;
    }
    .af-cartoon-empty.af-show { opacity: 1; }

    .af-caption {
      padding: 12px 16px 14px;
      text-align: left;
      font-style: italic;
      color: var(--af-muted);
      font-size: 14px;
      line-height: 1.5;
      min-height: 1.4em;
      transition: opacity 220ms ease;
      border-top: 1px solid var(--af-rule);
    }

    /* ----- Controls (pause/play indicator + replay) ----- */
    .af-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      font-size: 12px;
      color: var(--af-muted);
    }
    .af-controls .af-hint {
      letter-spacing: 0.04em;
    }
    .af-replay {
      background: transparent;
      border: 1px solid var(--af-muted);
      color: var(--af-muted);
      padding: 4px 12px;
      font: inherit;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: color 150ms ease, border-color 150ms ease;
    }
    .af-replay:hover { color: var(--af-fg); border-color: var(--af-fg); }

    /* ----- Node + edge animation primitives ----- */
    /* Each step toggles classes on these groups. Hidden = display:none
       so layout doesn't reserve space for unborn nodes; visible = opacity
       fade in. */
    .af-node-group {
      opacity: 0;
      transition: opacity 380ms ease, transform 420ms cubic-bezier(.2,.8,.2,1);
      transform-box: fill-box;
      transform-origin: center;
    }
    .af-node-group.af-visible { opacity: 1; }
    .af-node-group.af-highlight {
      animation: af-pulse 520ms cubic-bezier(.34,1.56,.64,1) 0s 1;
    }
    @keyframes af-pulse {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    /* Edges: stroke-dashoffset draw-on. */
    .af-edge-anim {
      transition: stroke-dashoffset 460ms ease-in-out, opacity 320ms ease;
    }

    .af-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 13.5px;
      fill: var(--af-fg);
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }
    .af-label-orphan { fill: var(--af-muted); font-style: italic; }
    .af-label-finish-green { fill: var(--af-fg); }

    /* Reduced motion: render the settled end-state instantly. */
    @media (prefers-reduced-motion: reduce) {
      .af-node-group { opacity: 1; transition: none; }
      .af-node-group.af-highlight { animation: none; }
      .af-edge-anim { transition: none; }
      .af-cartoon-frame { transition: none; }
    }
  </style>

<body>
  <main>
    <h1 style="font-size:18px;font-weight:600;text-align:center;margin-bottom:6px;">
      ADHD flowchart, animated (preview)
    </h1>
    <p style="text-align:center;font-size:12px;color:#6b7280;margin-top:0;">
      Standalone preview. The integration step lifts the
      <code>&lt;div class="af-figure"&gt;</code> block plus the inline
      <code>&lt;script&gt;</code> at the bottom into the article.
    </p>

    <!-- =========================================================
         The figure itself. The integration step lifts this whole
         block via _extract_balanced_block, keyed on `af-figure`.
         ========================================================= -->
    <div class="af-figure" id="af-figure">

      <p class="af-stepbar-meta">
        <span class="af-phase" id="af-phase">the meme</span>
        <span class="af-counter"><span id="af-counter-now">1</span> / 8</span>
      </p>
      <ol class="af-stepbar" id="af-stepbar" aria-label="Flowchart steps">
        <li data-step="1" data-phase="meme"></li>
        <li data-step="2" data-phase="meme"></li>
        <li data-step="3" data-phase="meme"></li>
        <li data-step="4" data-phase="orphan"></li>
        <li data-step="5" data-phase="sub"></li>
        <li data-step="6" data-phase="sub"></li>
        <li data-step="7" data-phase="sub"></li>
        <li data-step="8" data-phase="sub"></li>
      </ol>

      <div class="af-stage" id="af-stage">

        <div class="af-svg-pane">
          <div class="af-svg-wrap">
            <svg id="af-svg" viewBox="0 0 600 520" preserveAspectRatio="xMidYMid meet"
                 role="img" aria-labelledby="af-title af-desc">
              <title id="af-title">ADHD flowchart: meme then subverted</title>
              <desc id="af-desc">A step-by-step animation. The meme half lights up three nodes — get new idea, start new project, tell everyone — looping back to the start. A fourth, faded "finish project" sits off to the side, disconnected. The subverted half then lights up four new nodes — recognise the connection, hand the boring bits to a swarm, stay at the connection level, actually finish — closing the loop in green.</desc>

              <g id="af-root"></g>
            </svg>
          </div>
          <div class="af-controls">
            <span class="af-hint" id="af-hint">auto-advancing &middot; hover to pause</span>
            <button type="button" class="af-replay" id="af-replay" aria-label="Replay animation">replay</button>
          </div>
        </div>

        <div class="af-cartoon-pane" id="af-cartoon-pane">
          <div class="af-cartoon-stack" id="af-cartoon-stack">
            <!-- Cartoon frames are inserted by JS so missing PNGs degrade
                 gracefully to the empty state. -->
          </div>
          <div class="af-caption" id="af-caption">
            get new idea
          </div>
        </div>

      </div>
    </div>
  </main>

  <script>
    /* =========================================================
       ADHD flowchart — per-step scrolly, hand-drawn (rough.js).

       Eight steps, two phases:
         meme:   1 idea, 2 start, 3 tell (loop closes), 4 orphan reveal
         sub:    5 recognise connection, 6 hand to swarm,
                 7 stay at connection level, 8 actually finish

       Auto-advance ~3s per step; hover-to-pause on the figure;
       click any step-bar segment to jump. Reduced-motion holds
       step 1 statically.

       The rough.js drawing aesthetic is preserved across redraws.
       Theme-change flips re-build geometry with new colours.
       ========================================================= */
    window.AdhdFlowchart = (function () {
      'use strict';

      const SVG     = document.getElementById('af-svg');
      const ROOT    = document.getElementById('af-root');
      const CAPTION = document.getElementById('af-caption');
      const REPLAY  = document.getElementById('af-replay');
      const FIGURE  = document.getElementById('af-figure');
      const STAGE   = document.getElementById('af-stage');
      const PHASE   = document.getElementById('af-phase');
      const COUNTER = document.getElementById('af-counter-now');
      const HINT    = document.getElementById('af-hint');
      const STEPBAR = document.getElementById('af-stepbar');
      const CARTOON_STACK = document.getElementById('af-cartoon-stack');

      const NS = 'http://www.w3.org/2000/svg';
      const TOTAL_STEPS = 8;
      const DWELL_MS = 3000;

      // ---- Layout (in viewBox 600 x 520) -----------------------
      // Meme half lives in the top half (y < 260):
      //   idea  (TL)   --->   start (TR)
      //                          |
      //                          v
      //   finish (BL, faded) <-- tell (BR)   ... loop tell -> idea
      //
      // Subversion half lives in the bottom half (y >= 260),
      // a horizontal chain that links to "idea" at the top:
      //   recognise -> hand-to-swarm -> stay-at-level -> finish (green)
      //
      // The orphaned "finish project" node sits at BL of the meme;
      // the subversion's final node "actually finish" is its echo,
      // colour-flipped to green.
      const NODES = {
        // ----- meme (top half) -----
        idea:    { x:  60, y:  60, w: 200, h: 56, label: 'Get new idea' },
        start:   { x: 340, y:  60, w: 200, h: 56, label: 'Start new project' },
        tell:    { x: 340, y: 180, w: 200, h: 56, label: 'Tell everyone' },
        orphan:  { x:  60, y: 180, w: 200, h: 56, label: 'Finish project' },

        // ----- subversion (bottom half) -----
        recognise: { x:  20, y: 320, w: 170, h: 60, label: 'Recognise the connection' },
        swarm:     { x: 215, y: 320, w: 170, h: 60, label: 'Hand to a swarm' },
        stay:      { x: 410, y: 320, w: 170, h: 60, label: 'Stay at connection level' },
        finish:    { x: 215, y: 430, w: 170, h: 60, label: 'Actually finish' },
      };

      function attach(node, targetX, targetY) {
        const cx = node.x + node.w/2;
        const cy = node.y + node.h/2;
        const dx = targetX - cx;
        const dy = targetY - cy;
        const halfW = node.w/2 + 2;
        const halfH = node.h/2 + 2;
        const sx = dx === 0 ? Infinity : Math.abs(halfW / dx);
        const sy = dy === 0 ? Infinity : Math.abs(halfH / dy);
        const s = Math.min(sx, sy);
        return { x: cx + dx * s, y: cy + dy * s };
      }

      // ---- rough.js setup --------------------------------------
      let rc = null;

      function readVar(name) {
        return getComputedStyle(FIGURE).getPropertyValue(name).trim();
      }

      function themeColours() {
        return {
          fg:           readVar('--af-fg'),
          muted:        readVar('--af-muted'),
          memeFill:     readVar('--af-meme-fill'),
          memeStroke:   readVar('--af-meme-stroke'),
          subFill:      readVar('--af-sub-fill'),
          subStroke:    readVar('--af-sub-stroke'),
          orphanFill:   readVar('--af-orphan-fill'),
          orphanStroke: readVar('--af-orphan-stroke'),
          greenFill:    readVar('--af-finish-green-fill'),
          greenStroke:  readVar('--af-finish-green-stroke'),
          edge:         readVar('--af-edge'),
          edgeSoft:     readVar('--af-edge-soft'),
        };
      }

      function nodeOpts(fill, stroke) {
        return {
          fill: fill,
          fillStyle: 'hachure',
          fillWeight: 1.2,
          hachureGap: 6,
          stroke: stroke,
          strokeWidth: 1.8,
          roughness: 1.5,
          bowing: 1,
          seed: 7,
        };
      }
      function edgeOpts(stroke, opts) {
        return Object.assign({
          stroke: stroke,
          strokeWidth: 1.8,
          roughness: 1.5,
          bowing: 1.5,
          seed: 11,
          fill: 'none',
        }, opts || {});
      }

      // Wrap label text into <= 2 lines using a soft heuristic.
      function wrapLabel(parent, n, labelClass, lines) {
        const t = document.createElementNS(NS, 'text');
        t.setAttribute('class', 'af-label' + (labelClass ? ' ' + labelClass : ''));
        t.setAttribute('x', n.x + n.w/2);
        t.setAttribute('y', n.y + n.h/2);
        const lh = 15;
        const start = -((lines.length - 1) * lh) / 2;
        lines.forEach((ln, i) => {
          const ts = document.createElementNS(NS, 'tspan');
          ts.setAttribute('x', n.x + n.w/2);
          ts.setAttribute('dy', i === 0 ? start + 'px' : lh + 'px');
          ts.textContent = ln;
          t.appendChild(ts);
        });
        parent.appendChild(t);
        return t;
      }

      function splitLabel(label) {
        if (label.length <= 18) return [label];
        // Try to split on the most central space.
        const words = label.split(/\s+/);
        if (words.length === 1) return [label];
        let best = 0, bestDelta = Infinity;
        for (let i = 1; i < words.length; i++) {
          const left  = words.slice(0, i).join(' ');
          const right = words.slice(i).join(' ');
          const d = Math.abs(left.length - right.length);
          if (d < bestDelta) { bestDelta = d; best = i; }
        }
        return [words.slice(0, best).join(' '), words.slice(best).join(' ')];
      }

      function drawNode(parent, n, opts, labelClass) {
        const r = 10;
        const x = n.x, y = n.y, w = n.w, h = n.h;
        const d =
          'M ' + (x+r) + ' ' + y +
          ' L ' + (x+w-r) + ' ' + y +
          ' Q ' + (x+w) + ' ' + y + ' ' + (x+w) + ' ' + (y+r) +
          ' L ' + (x+w) + ' ' + (y+h-r) +
          ' Q ' + (x+w) + ' ' + (y+h) + ' ' + (x+w-r) + ' ' + (y+h) +
          ' L ' + (x+r) + ' ' + (y+h) +
          ' Q ' + x + ' ' + (y+h) + ' ' + x + ' ' + (y+h-r) +
          ' L ' + x + ' ' + (y+r) +
          ' Q ' + x + ' ' + y + ' ' + (x+r) + ' ' + y +
          ' Z';
        const node = rc.path(d, opts);
        parent.appendChild(node);
        wrapLabel(parent, n, labelClass, splitLabel(n.label));
        return node;
      }

      function drawArrow(parent, from, to, opts) {
        const mx = (from.x + to.x) / 2;
        const my = (from.y + to.y) / 2;
        const dx = to.x - from.x;
        const dy = to.y - from.y;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len;
        const ny =  dx / len;
        const curve = (opts && opts.curve != null) ? opts.curve : 10;
        const cx = mx + nx * curve;
        const cy = my + ny * curve;

        const g = document.createElementNS(NS, 'g');
        parent.appendChild(g);

        const path = rc.path(
          'M ' + from.x + ' ' + from.y +
          ' Q ' + cx + ' ' + cy + ' ' + to.x + ' ' + to.y,
          edgeOpts(opts.stroke, { strokeWidth: opts.strokeWidth || 1.8 })
        );
        g.appendChild(path);

        const tdx = to.x - cx, tdy = to.y - cy;
        const tlen = Math.hypot(tdx, tdy) || 1;
        const ux = tdx / tlen, uy = tdy / tlen;
        const ah = 9;
        const aw = 5;
        const baseX = to.x - ux * ah;
        const baseY = to.y - uy * ah;
        const px = -uy, py = ux;
        const a1x = baseX + px * aw, a1y = baseY + py * aw;
        const a2x = baseX - px * aw, a2y = baseY - py * aw;

        const head = rc.path(
          'M ' + a1x + ' ' + a1y + ' L ' + to.x + ' ' + to.y + ' L ' + a2x + ' ' + a2y,
          edgeOpts(opts.stroke, { strokeWidth: opts.strokeWidth || 1.8 })
        );
        g.appendChild(head);

        return g;
      }

      function prepareDrawOn(group) {
        const paths = group.querySelectorAll('path');
        const records = [];
        paths.forEach(p => {
          let len = 0;
          try { len = p.getTotalLength(); } catch (e) { len = 0; }
          if (len > 0) {
            p.setAttribute('stroke-dasharray', len);
            p.setAttribute('stroke-dashoffset', len);
            p.classList.add('af-edge-anim');
            records.push({ p: p, len: len });
          }
        });
        return records;
      }

      function svgGroup(cls) {
        const g = document.createElementNS(NS, 'g');
        g.setAttribute('class', cls);
        return g;
      }

      // ---- Build the whole figure ------------------------------
      // We pre-build EVERY node + edge as an animatable group,
      // then per-step toggle visibility / draw-on. This keeps the
      // animation idempotent + seekable.

      let nodes = {};   // id -> { group: <g> (af-node-group) }
      let edges = {};   // id -> { group: <g>, records: [...] }

      function build() {
        while (ROOT.firstChild) ROOT.removeChild(ROOT.firstChild);
        rc = rough.svg(SVG);
        const c = themeColours();
        nodes = {};
        edges = {};

        // Layered groups for z-order.
        const gMemeEdges = svgGroup('af-meme-edges-layer');
        const gSubEdges  = svgGroup('af-sub-edges-layer');
        const gMemeNodes = svgGroup('af-meme-nodes-layer');
        const gSubNodes  = svgGroup('af-sub-nodes-layer');

        ROOT.appendChild(gMemeEdges);
        ROOT.appendChild(gSubEdges);
        ROOT.appendChild(gMemeNodes);
        ROOT.appendChild(gSubNodes);

        // ----- Meme nodes -----
        function makeNode(parent, key, n, opts, labelClass) {
          const g = svgGroup('af-node-group');
          parent.appendChild(g);
          drawNode(g, n, opts, labelClass);
          nodes[key] = { group: g };
        }

        makeNode(gMemeNodes, 'idea',    NODES.idea,    nodeOpts(c.memeFill, c.memeStroke));
        makeNode(gMemeNodes, 'start',   NODES.start,   nodeOpts(c.memeFill, c.memeStroke));
        makeNode(gMemeNodes, 'tell',    NODES.tell,    nodeOpts(c.memeFill, c.memeStroke));
        makeNode(gMemeNodes, 'orphan',  NODES.orphan,  nodeOpts(c.orphanFill, c.orphanStroke), 'af-label-orphan');

        // ----- Subversion nodes -----
        // recognise + swarm + stay all use the same teal-tinted style
        // ("connection level" colour). finish flips green when reached.
        makeNode(gSubNodes, 'recognise', NODES.recognise, nodeOpts(c.subFill, c.subStroke));
        makeNode(gSubNodes, 'swarm',     NODES.swarm,     nodeOpts(c.subFill, c.subStroke));
        makeNode(gSubNodes, 'stay',      NODES.stay,      nodeOpts(c.subFill, c.subStroke));
        makeNode(gSubNodes, 'finish',    NODES.finish,    nodeOpts(c.greenFill, c.greenStroke), 'af-label-finish-green');

        // ----- Meme edges -----
        // idea -> start (top, l-r), start -> tell (right, top-down),
        // tell -> idea (long diagonal, bottom-right -> top-left, the
        // skip-the-orphan loop).
        function makeEdge(parent, key, from, to, opts) {
          const g = svgGroup('af-edge-group');
          parent.appendChild(g);
          drawArrow(g, from, to, opts);
          const records = prepareDrawOn(g);
          edges[key] = { group: g, records: records };
        }

        makeEdge(gMemeEdges, 'idea_start',
          attach(NODES.idea, NODES.start.x + NODES.start.w/2, NODES.start.y + NODES.start.h/2),
          attach(NODES.start, NODES.idea.x + NODES.idea.w/2, NODES.idea.y + NODES.idea.h/2),
          { stroke: c.edge, curve: -8 });

        makeEdge(gMemeEdges, 'start_tell',
          attach(NODES.start, NODES.tell.x + NODES.tell.w/2, NODES.tell.y + NODES.tell.h/2),
          attach(NODES.tell, NODES.start.x + NODES.start.w/2, NODES.start.y + NODES.start.h/2),
          { stroke: c.edge, curve: 8 });

        // tell -> idea: the diagonal loop closer.
        makeEdge(gMemeEdges, 'tell_idea',
          attach(NODES.tell, NODES.idea.x + NODES.idea.w/2, NODES.idea.y + NODES.idea.h/2),
          attach(NODES.idea, NODES.tell.x + NODES.tell.w/2, NODES.tell.y + NODES.tell.h/2),
          { stroke: c.edge, curve: 14 });

        // ----- Subversion edges -----
        // idea -> recognise: bridge from the meme's idea node DOWN into
        // the subversion. This lights up at step 5.
        makeEdge(gSubEdges, 'idea_recognise',
          attach(NODES.idea, NODES.recognise.x + NODES.recognise.w/2, NODES.recognise.y + NODES.recognise.h/2),
          attach(NODES.recognise, NODES.idea.x + NODES.idea.w/2, NODES.idea.y + NODES.idea.h/2),
          { stroke: c.subStroke, curve: -10, strokeWidth: 2 });

        // recognise -> swarm
        makeEdge(gSubEdges, 'recognise_swarm',
          attach(NODES.recognise, NODES.swarm.x + NODES.swarm.w/2, NODES.swarm.y + NODES.swarm.h/2),
          attach(NODES.swarm, NODES.recognise.x + NODES.recognise.w/2, NODES.recognise.y + NODES.recognise.h/2),
          { stroke: c.edgeSoft, curve: 0 });

        // swarm -> stay
        makeEdge(gSubEdges, 'swarm_stay',
          attach(NODES.swarm, NODES.stay.x + NODES.stay.w/2, NODES.stay.y + NODES.stay.h/2),
          attach(NODES.stay, NODES.swarm.x + NODES.swarm.w/2, NODES.swarm.y + NODES.swarm.h/2),
          { stroke: c.edgeSoft, curve: 0 });

        // stay -> finish: the closer.
        makeEdge(gSubEdges, 'stay_finish',
          attach(NODES.stay, NODES.finish.x + NODES.finish.w/2, NODES.finish.y + NODES.finish.h/2),
          attach(NODES.finish, NODES.stay.x + NODES.stay.w/2, NODES.stay.y + NODES.stay.h/2),
          { stroke: c.greenStroke, curve: 14, strokeWidth: 2.2 });
      }

      // ---- Per-step state ---------------------------------------
      // For each step n we declare which nodes + edges should be
      // visible (drawn) by the END of that step, and which node
      // gets the highlight pulse.
      //
      // n=1 idea (highlight)
      // n=2 idea + start + idea->start edge (start highlight)
      // n=3 idea + start + tell + start->tell + tell->idea (tell highlight)
      // n=4 + orphan revealed (orphan highlight)
      // n=5 + recognise + idea->recognise (recognise highlight)
      // n=6 + swarm + recognise->swarm (swarm highlight)
      // n=7 + stay + swarm->stay (stay highlight)
      // n=8 + finish + stay->finish (finish highlight)
      const STEP_NODES = [
        [],                                                       // step 0 (off)
        ['idea'],                                                 // 1
        ['idea', 'start'],                                        // 2
        ['idea', 'start', 'tell'],                                // 3
        ['idea', 'start', 'tell', 'orphan'],                      // 4
        ['idea', 'start', 'tell', 'orphan', 'recognise'],         // 5
        ['idea', 'start', 'tell', 'orphan', 'recognise', 'swarm'],// 6
        ['idea', 'start', 'tell', 'orphan', 'recognise', 'swarm', 'stay'],          // 7
        ['idea', 'start', 'tell', 'orphan', 'recognise', 'swarm', 'stay', 'finish'],// 8
      ];
      const STEP_EDGES = [
        [],
        [],
        ['idea_start'],
        ['idea_start', 'start_tell', 'tell_idea'],
        ['idea_start', 'start_tell', 'tell_idea'],
        ['idea_start', 'start_tell', 'tell_idea', 'idea_recognise'],
        ['idea_start', 'start_tell', 'tell_idea', 'idea_recognise', 'recognise_swarm'],
        ['idea_start', 'start_tell', 'tell_idea', 'idea_recognise', 'recognise_swarm', 'swarm_stay'],
        ['idea_start', 'start_tell', 'tell_idea', 'idea_recognise', 'recognise_swarm', 'swarm_stay', 'stay_finish'],
      ];
      const STEP_HIGHLIGHT = [
        null, 'idea', 'start', 'tell', 'orphan', 'recognise', 'swarm', 'stay', 'finish'
      ];

      const CAPTIONS = [
        '',
        'get new idea',
        'start new project',
        'tell everyone &mdash; loop closes, the meme runs',
        'finish project, sitting in the corner &mdash; never connected',
        'recognise it&rsquo;s connected to three previous ideas',
        'hand the boring bits to a swarm of agents',
        'stay at the connection level',
        'actually finish &mdash; the brain that was a tax is now an asset',
      ];

      const PHASE_LABEL = [
        '', 'the meme', 'the meme', 'the meme', 'the orphan',
        'the subversion', 'the subversion', 'the subversion', 'the subversion',
      ];

      // Cartoon mapping. null = no cartoon panel (show empty state).
      const CARTOON_FOR_STEP = [
        null,
        'figures/cartoon-get-idea.png',          // 1
        'figures/cartoon-start-project.png',     // 2
        'figures/cartoon-tell-everyone.png',     // 3
        null,                                    // 4 — orphan reveal, no cartoon (the gag)
        'figures/cartoon-orchestrator.png',      // 5 — recognise the connection (reuses orchestrator)
        'figures/cartoon-orchestrator.png',      // 6 — hand to swarm (orchestrator again, fits exactly)
        'figures/cartoon-normal-things.png',     // 7 — stay at connection level (talk normal things)
        'figures/cartoon-actually-finish.png',   // 8 — actually finish
      ];
      // When the figure is integrated into the article at root level,
      // the figures/ prefix is correct. The standalone preview at
      // figures/adhd-flowchart-animated.html wants the bare filename.
      // We try the prefixed path first; if the standalone preview is in
      // use we'll detect the URL and strip it.
      function resolveCartoonSrc(src) {
        if (!src) return null;
        // Standalone preview lives in /figures/ — strip the prefix so
        // images load from the same dir.
        const here = (window.location.pathname || '');
        if (here.indexOf('/figures/') !== -1) {
          return src.replace(/^figures\//, '');
        }
        return src;
      }

      // Build cartoon frame elements lazily.
      const cartoonFrames = {};
      function getCartoonFrame(srcKey) {
        if (!srcKey) return null;
        if (cartoonFrames[srcKey]) return cartoonFrames[srcKey];
        const wrap = document.createElement('div');
        wrap.className = 'af-cartoon-frame';
        const img = document.createElement('img');
        img.src = resolveCartoonSrc(srcKey);
        img.alt = '';
        img.loading = 'lazy';
        // If the image fails to load, hide the frame and let the empty-
        // state copy show instead.
        img.addEventListener('error', () => {
          wrap.dataset.broken = 'true';
        });
        wrap.appendChild(img);
        CARTOON_STACK.appendChild(wrap);
        cartoonFrames[srcKey] = wrap;
        return wrap;
      }

      // ---- Apply state for step n ------------------------------
      function setNodeVisible(g, visible, animated) {
        if (!g) return;
        if (animated) {
          g.classList.toggle('af-visible', visible);
        } else {
          // Snap with no transition.
          const prev = g.style.transition;
          g.style.transition = 'none';
          g.classList.toggle('af-visible', visible);
          // Force reflow then restore.
          // eslint-disable-next-line no-unused-expressions
          g.getBoundingClientRect();
          requestAnimationFrame(() => { g.style.transition = prev || ''; });
        }
      }

      function setEdgeDrawn(rec, drawn, animated, durationMs) {
        rec.records.forEach(r => {
          if (drawn) {
            if (animated) {
              r.p.style.transitionDuration = (durationMs || 460) + 'ms';
              // eslint-disable-next-line no-unused-expressions
              r.p.getBoundingClientRect();
              r.p.setAttribute('stroke-dashoffset', '0');
              rec.group.style.opacity = '1';
            } else {
              r.p.style.transitionDuration = '0ms';
              r.p.setAttribute('stroke-dashoffset', '0');
              rec.group.style.opacity = '1';
            }
          } else {
            r.p.style.transitionDuration = '0ms';
            r.p.setAttribute('stroke-dashoffset', r.len);
            rec.group.style.opacity = '0';
          }
        });
      }

      function highlight(key) {
        // Clear previous pulses.
        Object.values(nodes).forEach(rec => {
          if (rec && rec.group) rec.group.classList.remove('af-highlight');
        });
        if (!key) return;
        const rec = nodes[key];
        if (!rec) return;
        // Re-add the class on the next frame so the CSS animation re-runs.
        requestAnimationFrame(() => {
          rec.group.classList.add('af-highlight');
        });
      }

      function setCartoon(srcKey) {
        // Hide any currently-shown frame, show the new one.
        Object.values(cartoonFrames).forEach(f => f.classList.remove('af-show'));
        if (!srcKey) return;
        const f = getCartoonFrame(srcKey);
        if (f) f.classList.add('af-show');
      }

      function setCaption(html) {
        CAPTION.innerHTML = html;
      }

      function setStepBar(n) {
        const items = STEPBAR.querySelectorAll('li');
        items.forEach((li, i) => {
          li.classList.remove('af-step-active', 'af-step-done');
          if (i + 1 === n) li.classList.add('af-step-active');
          else if (i + 1 < n) li.classList.add('af-step-done');
        });
      }

      // ---- goToStep(n, animated) -------------------------------
      let currentStep = 0;
      function goToStep(n, animated) {
        if (n < 1 || n > TOTAL_STEPS) return;
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced) animated = false;

        const wantNodes = new Set(STEP_NODES[n]);
        const wantEdges = new Set(STEP_EDGES[n]);

        // Nodes: visible iff in wantNodes.
        Object.keys(nodes).forEach(k => {
          setNodeVisible(nodes[k].group, wantNodes.has(k), animated && (n > currentStep));
        });
        // Edges: drawn iff in wantEdges.
        Object.keys(edges).forEach(k => {
          setEdgeDrawn(edges[k], wantEdges.has(k), animated && (n > currentStep));
        });
        // Highlight pulse on the node that just appeared.
        if (animated && n > currentStep) {
          // Tiny delay so the appear-fade has time to start before pulse.
          setTimeout(() => highlight(STEP_HIGHLIGHT[n]), 120);
        } else {
          // Seeking: snap with no pulse.
          highlight(null);
        }

        setCaption(CAPTIONS[n]);
        setCartoon(CARTOON_FOR_STEP[n]);
        if (PHASE) PHASE.textContent = PHASE_LABEL[n];
        if (COUNTER) COUNTER.textContent = String(n);
        setStepBar(n);
        if (STAGE) STAGE.dataset.step = String(n);
        currentStep = n;
      }

      // ---- Auto-advance + hover-pause + click-jump ------------
      let autoTimer = null;
      let isPaused = false;
      let isFinished = false;

      function clearAutoTimer() {
        if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
      }
      function scheduleNext() {
        clearAutoTimer();
        if (isPaused || isFinished) return;
        autoTimer = setTimeout(() => {
          if (currentStep >= TOTAL_STEPS) {
            isFinished = true;
            if (HINT) HINT.textContent = 'click replay to run again';
            return;
          }
          goToStep(currentStep + 1, true);
          scheduleNext();
        }, DWELL_MS);
      }

      function pause() {
        if (isPaused) return;
        isPaused = true;
        clearAutoTimer();
        if (HINT && !isFinished) HINT.textContent = 'paused &middot; move away to resume';
      }
      function resume() {
        if (!isPaused) return;
        isPaused = false;
        if (HINT && !isFinished) HINT.innerHTML = 'auto-advancing &middot; hover to pause';
        scheduleNext();
      }

      function init() {
        build();

        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced) {
          // Hold step 1 statically per the brief.
          goToStep(1, false);
          if (HINT) HINT.textContent = 'reduced motion';
          // Mark all step-bar items neutral.
          return;
        }

        // Cold load: go to step 1 instantly, schedule the rest.
        goToStep(1, false);
        scheduleNext();

        // Hover-to-pause on the figure.
        FIGURE.addEventListener('mouseenter', pause);
        FIGURE.addEventListener('mouseleave', resume);
        FIGURE.addEventListener('focusin', pause);
        FIGURE.addEventListener('focusout', resume);

        // Click any step-bar segment to jump there.
        STEPBAR.addEventListener('click', e => {
          const li = e.target.closest('li[data-step]');
          if (!li) return;
          const n = parseInt(li.dataset.step, 10);
          if (!n) return;
          isFinished = (n >= TOTAL_STEPS);
          // Animate forward, snap backward.
          goToStep(n, n > currentStep);
          if (isFinished) {
            if (HINT) HINT.textContent = 'click replay to run again';
            clearAutoTimer();
          } else {
            // If we just jumped into the middle, keep auto-advancing
            // unless the figure is currently hovered.
            if (!isPaused) scheduleNext();
          }
        });

        // Replay button.
        REPLAY.addEventListener('click', () => {
          isFinished = false;
          goToStep(1, false);
          if (HINT) HINT.innerHTML = 'auto-advancing &middot; hover to pause';
          if (!isPaused) scheduleNext();
        });

        // Theme change: rebuild geometry with new colours, restore state.
        const mq = window.matchMedia('(prefers-color-scheme: dark)');
        const onSchemeChange = () => {
          const remembered = currentStep || 1;
          build();
          // Clear cached cartoon frames? They're DOM nodes inside the
          // pane and the pane isn't rebuilt — fine to leave.
          goToStep(remembered, false);
        };
        if (mq.addEventListener) mq.addEventListener('change', onSchemeChange);
        else if (mq.addListener) mq.addListener(onSchemeChange);
      }

      function ready(fn) {
        if (window.rough) fn();
        else window.addEventListener('load', fn, { once: true });
      }
      ready(init);

      return { goToStep: goToStep };
    })();
  </script>

  <!-- ===========================================================
       Notes for the integration step / Harry:

       - Per-step scrollytelling figure. Eight steps:
           1 idea  (cartoon: get-idea.png)
           2 start (cartoon: start-project.png)
           3 tell  (cartoon: tell-everyone.png) — meme loop closes
           4 orphan (the gag — finish-project sits faded off-side)
           5 recognise the connection (cartoon: orchestrator.png)
           6 hand to a swarm           (cartoon: orchestrator.png)
           7 stay at connection level  (cartoon: normal-things.png)
           8 actually finish           (cartoon: actually-finish.png)

       - Auto-advance ~3000 ms per step. Hover/focus on .af-figure
         pauses the timer; mouseleave/blur resumes. Click any
         segment of the top step-bar to jump — animates forward,
         snaps backward.

       - Reduced motion: the IIFE detects the media query and holds
         step 1 statically.

       - On mobile (<760 px) the .af-stage grid stacks vertically:
         flowchart top, cartoon panel below. The CSS handles it.

       - Keep the IIFE token "AdhdFlowchart" and the root marker
         <div class="af-figure"> so the build script's
         _extract_balanced_block + flowchart_assets() helpers find
         the figure unchanged.

       - Cartoons are referenced as `figures/<name>.png` for the
         article integration. The standalone preview file lives
         INSIDE figures/, so resolveCartoonSrc strips the prefix
         when window.location.pathname contains "/figures/". Both
         contexts work without extra config.

       - rough.js: roughness=1.5, strokeWidth=1.8, fillStyle=
         "hachure", fixed seed for reproducibility across redraws.
         Theme-change rebuild is preserved — currentStep is
         remembered so the figure re-renders into the same beat
         after the dark-mode flip.
       =========================================================== -->
</body>
</html>
