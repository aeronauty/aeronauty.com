<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The question lands</title>
<!--
  Standalone page — iframed by data-black-market.html for beat 1 of the
  scrolly. Loads Tailwind Play CDN inside this isolated frame so the
  simulator's utility classes don't bleed into the article's stylesheet.
-->
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  body { display: flex; align-items: center; justify-content: center; padding: 12px; box-sizing: border-box; }
  #host {
    width: 100%;
    max-width: 640px;
    height: 360px;
    box-sizing: border-box;
  }
  /* Message-enter / typing-dot animations the simulator expects. */
  .message-enter { opacity: 0; transform: translateY(6px); }
  .message-visible { opacity: 1; transform: translateY(0); transition: opacity 220ms ease, transform 220ms ease; }
  .typing-dot {
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.18s; }
  .typing-dot:nth-child(3) { animation-delay: 0.36s; }
  @keyframes typing-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-3px); opacity: 1; }
  }
</style>
</head>
<body>
  <div id="host"></div>
  <script src="chat-simulator-tailwind.js"></script>
  <script>
    const sim = new ChatSimulator('#host', {
      theme: 'slack',
      loop: true,
      loopDelay: 4000,
      participants: [
        { id: 'priya',  name: 'Priya Shah',     avatar: 'PS' },
        { id: 'sarah',  name: 'Sarah Carmichael', avatar: 'SC' },
      ],
      messages: [
        {
          from: 'priya',
          delay: 600,
          typing: { duration: 1100 },
          text: "Quick one — flight-controls signed off the design package on the back of the Marsh hinge-moment plot from the November DR.",
        },
        {
          from: 'priya',
          delay: 200,
          typing: { duration: 900 },
          text: "Configuration's changed twice since. <strong>Is that plot still valid?</strong> Need an answer before Friday's gate.",
        },
        {
          from: 'sarah',
          delay: 1200,
          typing: { duration: 2200 },
          text: "Let me dig.",
        },
      ],
    });
    // Autoplay; pause when iframe is offscreen / hidden.
    document.addEventListener('DOMContentLoaded', () => sim.play());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) sim.pause(); else sim.play();
    });
  </script>
</body>
</html>
