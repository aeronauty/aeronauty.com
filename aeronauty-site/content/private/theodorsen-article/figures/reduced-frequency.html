<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reduced Frequency</title>
  <style>
    :root{--ink:#171717;--muted:#60646c;--rule:#d9d9d4;--paper:#fbfaf7;--teal:#0f766e;--blue:#2563eb;--amber:#bd6b00}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.widget{width:min(980px,100%);margin:0 auto;padding:16px}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}h1{margin:0;font-size:24px;letter-spacing:0}button{border:1px solid var(--rule);background:#fff;border-radius:6px;padding:7px 10px;cursor:pointer}button.active{border-color:var(--teal);background:#ecfdf5}.panel{border:1px solid var(--rule);border-radius:8px;background:#fff;padding:16px}.annotation{margin:0 0 12px;color:var(--muted);line-height:1.55}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f8fafc;border:1px solid #e5e7eb;border-radius:7px;padding:12px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:18px;margin-top:4px}svg{width:100%;height:auto;display:block}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body data-mode="analogy">
  <main class="widget"><div class="bar"><h1>Reduced frequency</h1><div><button data-set-mode="analogy" class="active">Analogy</button><button data-set-mode="maths">Maths</button></div></div><section class="panel"><p id="annotation" class="annotation"></p><div class="stats"><div class="stat"><span>frequency</span><strong id="freq"></strong></div><div class="stat"><span>speed</span><strong id="speed"></strong></div><div class="stat"><span>chord</span><strong id="chord"></strong></div><div class="stat"><span>k</span><strong id="kval"></strong></div></div><div id="plot"></div></section></main>
  <script>
    const DATA_URL='../data/theodorsen_article_data.json', colors={ink:'#171717',muted:'#60646c',rule:'#e4e4df',teal:'#0f766e',blue:'#2563eb',amber:'#bd6b00'}; let data, active=3;
    const annotations={analogy:'k compares how fast the wing is being shaken with how fast the flow crosses a half chord. Small k feels patient; large k feels forgetful.',maths:'The generated examples use k=omega c/(2U) with c=1 m and U=50 m/s, so frequency maps directly into the non-dimensional wake-memory parameter.'};
    function setMode(m){document.body.dataset.mode=m;document.querySelectorAll('[data-set-mode]').forEach(b=>b.classList.toggle('active',b.dataset.setMode===m));render()} function scale(v,a,b,c,d){return c+(v-a)/(b-a)*(d-c)}
    function render(){if(!data)return;const rows=data.reducedFrequency,row=rows[active];document.getElementById('annotation').textContent=annotations[document.body.dataset.mode||'analogy'];document.getElementById('freq').textContent=row.frequencyHz+' Hz';document.getElementById('speed').textContent=row.speedMps+' m/s';document.getElementById('chord').textContent=row.chordM+' m';document.getElementById('kval').textContent=row.k.toFixed(3);const w=860,h=280,p=42,xd=[0,Math.max(...rows.map(r=>r.frequencyHz))*1.05],yd=[0,Math.max(...rows.map(r=>r.k))*1.15];const bars=rows.map((r,i)=>{const x=scale(r.frequencyHz,xd[0],xd[1],p,w-p),y=scale(r.k,yd[0],yd[1],h-p,p);return`<g class="pt" data-i="${i}" style="cursor:pointer"><line x1="${x}" x2="${x}" y1="${h-p}" y2="${y}" stroke="${i===active?colors.teal:colors.blue}" stroke-width="${i===active?6:3}" opacity=".85"/><circle cx="${x}" cy="${y}" r="${i===active?7:5}" fill="${i===active?colors.teal:colors.blue}"/><text x="${x}" y="${h-p+18}" text-anchor="middle" font-size="11" fill="${colors.muted}">${r.label}</text></g>`}).join('');document.getElementById('plot').innerHTML=`<svg viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" rx="8" fill="#fbfbf8"/><line x1="${p}" x2="${w-p}" y1="${h-p}" y2="${h-p}" stroke="#aaa"/><line x1="${p}" x2="${p}" y1="${p}" y2="${h-p}" stroke="#aaa"/>${bars}<text x="${w/2}" y="${h-8}" text-anchor="middle" font-size="12" fill="${colors.muted}">oscillation frequency</text><text x="14" y="${h/2}" text-anchor="middle" font-size="12" fill="${colors.muted}" transform="rotate(-90 14 ${h/2})">reduced frequency k</text></svg>`;document.querySelectorAll('.pt').forEach(g=>g.addEventListener('click',()=>{active=Number(g.dataset.i);render()}))}
    window.addEventListener('message',e=>{if(e.data&&e.data.type==='theodorsen-mode')setMode(e.data.mode==='maths'?'maths':'analogy')});
    document.querySelectorAll('[data-set-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.setMode)));fetch(DATA_URL).then(r=>r.json()).then(j=>{data=j;render()});
  </script>
</body>
</html>
