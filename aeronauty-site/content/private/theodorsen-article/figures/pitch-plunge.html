<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pitch Plunge</title>
  <style>
    :root{--ink:#171717;--muted:#60646c;--rule:#d9d9d4;--paper:#fbfaf7;--teal:#0f766e;--blue:#2563eb;--amber:#bd6b00;--red:#be123c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.widget{width:min(1020px,100%);margin:0 auto;padding:16px}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}h1{margin:0;font-size:24px;letter-spacing:0}button{border:1px solid var(--rule);background:#fff;border-radius:6px;padding:7px 10px;cursor:pointer}button.active{border-color:var(--teal);background:#ecfdf5}.panel{border:1px solid var(--rule);border-radius:8px;background:#fff;padding:16px}.annotation{margin:0 0 12px;color:var(--muted);line-height:1.55}svg{width:100%;height:auto;display:block}
  </style>
</head>
<body data-mode="analogy">
  <main class="widget"><div class="bar"><h1>Pitch and plunge components</h1><div><button data-set-mode="analogy" class="active">Analogy</button><button data-set-mode="maths">Maths</button></div></div><section class="panel"><p id="annotation" class="annotation"></p><div id="plot"></div></section></main>
  <script>
    const DATA_URL='../data/theodorsen_article_data.json', colors={ink:'#171717',muted:'#60646c',rule:'#e4e4df',teal:'#0f766e',blue:'#2563eb',amber:'#bd6b00',red:'#be123c'}; let data;
    const annotations={analogy:'Pitch and plunge both pull on lift, but their timing is different. The wake-memory part and the added-mass part trade importance as k grows.',maths:'Rows store simplified phasor components. Circulatory pitch/plunge terms are scaled by C(k); added-mass terms are kept as explicit in-phase or quadrature components.'};
    function setMode(m){document.body.dataset.mode=m;document.querySelectorAll('[data-set-mode]').forEach(b=>b.classList.toggle('active',b.dataset.setMode===m));render()} function scale(v,a,b,c,d){return c+(v-a)/(b-a)*(d-c)}
    function pth(rows,y,xd,yd,w,h,p){return rows.map((r,i)=>`${i?'L':'M'}${scale(r.k,xd[0],xd[1],p,w-p).toFixed(1)} ${scale(y(r),yd[0],yd[1],h-p,p).toFixed(1)}`).join(' ')}
    function mag(r,prefix){return Math.hypot(r[prefix+'Real'],r[prefix+'Imag'])}
    function render(){if(!data)return;document.getElementById('annotation').textContent=annotations[document.body.dataset.mode||'analogy'];const rows=data.pitchPlunge.rows,w=880,h=360,p=48,xd=[0,1.3],all=rows.flatMap(r=>[mag(r,'pitchCirculatory'),mag(r,'plungeCirculatory'),mag(r,'pitchAddedMass'),mag(r,'plungeAddedMass'),r.totalMagnitude]),yd=[0,Math.max(...all)*1.08];document.getElementById('plot').innerHTML=`<svg viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" rx="8" fill="#fbfbf8"/><line x1="${p}" x2="${w-p}" y1="${h-p}" y2="${h-p}" stroke="#aaa"/><line x1="${p}" x2="${p}" y1="${p}" y2="${h-p}" stroke="#aaa"/><path d="${pth(rows,r=>mag(r,'pitchCirculatory'),xd,yd,w,h,p)}" fill="none" stroke="${colors.teal}" stroke-width="3"/><path d="${pth(rows,r=>mag(r,'plungeCirculatory'),xd,yd,w,h,p)}" fill="none" stroke="${colors.blue}" stroke-width="3"/><path d="${pth(rows,r=>mag(r,'pitchAddedMass'),xd,yd,w,h,p)}" fill="none" stroke="${colors.amber}" stroke-width="2.5" stroke-dasharray="7 6"/><path d="${pth(rows,r=>mag(r,'plungeAddedMass'),xd,yd,w,h,p)}" fill="none" stroke="${colors.red}" stroke-width="2.5" stroke-dasharray="7 6"/><path d="${pth(rows,r=>r.totalMagnitude,xd,yd,w,h,p)}" fill="none" stroke="${colors.ink}" stroke-width="4" opacity=".75"/><text x="${p+8}" y="${p+18}" font-size="12" fill="${colors.teal}">pitch circulatory</text><text x="${p+8}" y="${p+36}" font-size="12" fill="${colors.blue}">plunge circulatory</text><text x="${p+8}" y="${p+54}" font-size="12" fill="${colors.amber}">pitch added mass</text><text x="${p+8}" y="${p+72}" font-size="12" fill="${colors.red}">plunge added mass</text><text x="${p+8}" y="${p+90}" font-size="12" fill="${colors.ink}">total</text><text x="${w/2}" y="${h-9}" text-anchor="middle" font-size="12" fill="${colors.muted}">reduced frequency k</text></svg>`}
    window.addEventListener('message',e=>{if(e.data&&e.data.type==='theodorsen-mode')setMode(e.data.mode==='maths'?'maths':'analogy')});
    document.querySelectorAll('[data-set-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.setMode)));fetch(DATA_URL).then(r=>r.json()).then(j=>{data=j;render()});
  </script>
</body>
</html>
