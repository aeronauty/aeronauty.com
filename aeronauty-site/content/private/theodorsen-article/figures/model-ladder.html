<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Model Ladder</title>
  <style>
    :root{--ink:#171717;--muted:#60646c;--rule:#d9d9d4;--paper:#fbfaf7;--teal:#0f766e;--blue:#2563eb;--amber:#bd6b00}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.widget{width:min(1040px,100%);margin:0 auto;padding:16px}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}h1{margin:0;font-size:24px;letter-spacing:0}button{border:1px solid var(--rule);background:#fff;border-radius:6px;padding:7px 10px;cursor:pointer}button.active{border-color:var(--teal);background:#ecfdf5}.panel{border:1px solid var(--rule);border-radius:8px;background:#fff;padding:16px}.grid{display:grid;grid-template-columns:320px 1fr;gap:14px}.model{width:100%;text-align:left;margin-bottom:8px}.model strong{display:block}.model span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.detail{color:var(--muted);line-height:1.55}.pill{display:inline-block;border:1px solid var(--rule);border-radius:999px;padding:5px 8px;margin:0 6px 6px 0;color:#444;background:#fafafa;font-size:12px}.schema{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#f8fafc;border:1px solid #e5e7eb;border-radius:7px;padding:12px;color:#334155;overflow:auto}@media(max-width:760px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body data-mode="analogy">
  <main class="widget"><div class="bar"><h1>Model ladder</h1><div><button data-set-mode="analogy" class="active">Analogy</button><button data-set-mode="maths">Maths</button></div></div><section class="panel grid"><div id="list"></div><div><h2 id="title"></h2><p id="note" class="detail"></p><div id="pills"></div><pre id="schema" class="schema"></pre></div></section></main>
  <script>
    const DATA_URL='../data/theodorsen_article_data.json'; let data, active=0;
    function setMode(m){document.body.dataset.mode=m;document.querySelectorAll('[data-set-mode]').forEach(b=>b.classList.toggle('active',b.dataset.setMode===m));render()}
    function render(){if(!data)return;const mode=document.body.dataset.mode||'analogy', rows=data.modelLadder;document.getElementById('list').innerHTML=rows.map((r,i)=>`<button class="model ${i===active?'active':''}" data-i="${i}"><strong>${r.model}</strong><span>${r.layer}</span></button>`).join('');document.querySelectorAll('.model').forEach(b=>b.addEventListener('click',()=>{active=Number(b.dataset.i);render()}));const r=rows[active];document.getElementById('title').textContent=r.model;document.getElementById('note').textContent=mode==='maths'?r.maths_note:r.analogy_note;document.getElementById('pills').innerHTML=`<span class="pill">${r.memory}</span><span class="pill">cost ${r.relative_cost}x</span><span class="pill">${r.status}</span><span class="pill">${r.resolves_unsteadiness?'unsteady':'steady'}</span><span class="pill">${r.viscous?'viscous':'inviscid'}</span>`;document.getElementById('schema').textContent=Object.keys(r.flow360_schema||{}).length?JSON.stringify(r.flow360_schema,null,2):'No Flow360 case schema for this analytic rung.'}
    window.addEventListener('message',e=>{if(e.data&&e.data.type==='theodorsen-mode')setMode(e.data.mode==='maths'?'maths':'analogy')});
    document.querySelectorAll('[data-set-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.setMode)));fetch(DATA_URL).then(r=>r.json()).then(j=>{data=j;render()});
  </script>
</body>
</html>
