<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lift History Integral</title>
  <style>
    :root { --ink:#171717; --muted:#60646c; --rule:#d9d9d4; --paper:#fbfaf7; --teal:#0f766e; --blue:#2563eb; --amber:#bd6b00; }
    * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .widget { width:min(1040px,100%); margin:0 auto; padding:16px; } .bar { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:12px; }
    h1 { margin:0; font-size:24px; letter-spacing:0; } button { border:1px solid var(--rule); background:#fff; border-radius:6px; padding:7px 10px; cursor:pointer; } button.active { border-color:var(--teal); background:#ecfdf5; }
    .panel { border:1px solid var(--rule); border-radius:8px; background:#fff; padding:16px; } .grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; }
    .annotation { margin:0 0 12px; color:var(--muted); line-height:1.55; } svg { width:100%; height:auto; display:block; }
    @media (max-width:760px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body data-mode="analogy">
  <main class="widget">
    <div class="bar"><h1>Lift history integral</h1><div><button data-set-mode="analogy" class="active">Analogy</button><button data-set-mode="maths">Maths</button></div></div>
    <section class="panel">
      <p class="annotation" id="annotation"></p>
      <div class="grid"><div id="kernel"></div><div id="response"></div></div>
    </section>
  </main>
  <script>
    const DATA_URL='../data/theodorsen_article_data.json', colors={ink:'#171717',muted:'#60646c',rule:'#e4e4df',teal:'#0f766e',blue:'#2563eb',amber:'#bd6b00'}; let data;
    const annotations={analogy:'The lift at this instant is an edited memory of earlier angle changes. Recent changes matter most; older wake entries fade but never vanish cleanly.',maths:'The convolution picture weights dalpha/ds by dPhi/ds. This widget plots the kernel beside the response to a finite ramp in angle of attack.'};
    function setMode(m){document.body.dataset.mode=m;document.querySelectorAll('[data-set-mode]').forEach(b=>b.classList.toggle('active',b.dataset.setMode===m));render();}
    function scale(v,a,b,c,d){return c+(v-a)/(b-a)*(d-c)} function extent(vals,p=.08){const mn=Math.min(...vals),mx=Math.max(...vals),sp=mx-mn||1;return[mn-sp*p,mx+sp*p]}
    function draw(el, rows, series, xKey, label){const w=520,h=310,p=42,xd=extent(rows.map(r=>r[xKey]),.02),yd=extent(series.flatMap(s=>rows.map(s.y)),.12); const paths=series.map(s=>`<path d="${rows.map((r,i)=>`${i?'L':'M'}${scale(r[xKey],xd[0],xd[1],p,w-p).toFixed(1)} ${scale(s.y(r),yd[0],yd[1],h-p,p).toFixed(1)}`).join(' ')}" fill="none" stroke="${s.c}" stroke-width="${s.w||3}"/>`).join(''); const leg=series.map((s,i)=>`<text x="${p+8}" y="${p+18+i*18}" font-size="12" fill="${s.c}">${s.l}</text>`).join(''); el.innerHTML=`<svg viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" rx="8" fill="#fbfbf8"/><line x1="${p}" x2="${w-p}" y1="${h-p}" y2="${h-p}" stroke="#aaa"/><line x1="${p}" x2="${p}" y1="${p}" y2="${h-p}" stroke="#aaa"/>${paths}${leg}<text x="${w/2}" y="${h-9}" text-anchor="middle" font-size="12" fill="${colors.muted}">${label}</text></svg>`}
    function render(){if(!data)return; document.getElementById('annotation').textContent=annotations[document.body.dataset.mode||'analogy']; draw(document.getElementById('kernel'),data.liftHistory.kernel,[{l:'Wagner phi(s)',c:colors.teal,y:r=>r.phi,w:3},{l:'memory kernel dPhi/ds',c:colors.amber,y:r=>r.dPhiDs*5,w:2}], 's','convective time s'); draw(document.getElementById('response'),data.liftHistory.rampResponse,[{l:'angle command, deg/10',c:colors.blue,y:r=>r.alphaDeg/10,w:2},{l:'history-integral CL',c:colors.teal,y:r=>r.memoryCl,w:3}], 's','finite ramp response');}
    window.addEventListener('message',e=>{if(e.data&&e.data.type==='theodorsen-mode')setMode(e.data.mode==='maths'?'maths':'analogy')});
    document.querySelectorAll('[data-set-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.setMode))); fetch(DATA_URL).then(r=>r.json()).then(j=>{data=j;render();});
  </script>
</body>
</html>
